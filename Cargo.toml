[package]
name = "doppel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Finds duplicate, resized and edited copies of images and videos using the GPU"
license = "MIT"
readme = "README.md"
keywords = ["duplicates", "dedupe", "images", "video", "gpu"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
burn-tensor = { version = "0.22", default-features = false, features = ["vulkan", "fusion", "autotune"] }
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
dirs = "7"
fast_image_resize = { version = "6.1", features = ["image"] }
half = { version = "2.7", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
indicatif = "0.18"
jwalk = "0.9"
kamadak-exif = "0.6"
nalgebra = "0.35.0"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rayon = "1.11"
rusqlite = "0.40"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = "5"
turbojpeg = { version = "1.3", default-features = false, features = ["image", "pkg-config"] }

[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
